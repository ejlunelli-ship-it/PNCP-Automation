.d3 { fill:var(--s3); stroke:var(--surface); stroke-width:2; }
.bar1 { fill:var(--s1); }
.est { stroke:var(--ink); stroke-width:2; stroke-linecap:round; }
.hit { fill:transparent; }
g.m:hover .d1, g.m:hover .d2, g.m:hover .d3 { stroke:var(--ink); }
