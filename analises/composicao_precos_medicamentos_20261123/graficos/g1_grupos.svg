.ref { stroke:var(--ink2); stroke-width:1; }
.ci1 { stroke:var(--s1); stroke-width:2; stroke-linecap:round; }
.ci2 { stroke:var(--s2); stroke-width:2; stroke-linecap:round; }
.ci3 { stroke:var(--s3); stroke-width:2; stroke-linecap:round; }
