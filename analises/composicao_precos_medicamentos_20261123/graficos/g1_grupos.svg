<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="tt dd"><title id="tt">Efeito do AF por grupo de produtos (lp, IC95)</title><desc id="dd">Exploratório. A = referência original; G = referência G com dispersão ≤ 0,80. Pesos de precisão do grupo.</desc><style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
