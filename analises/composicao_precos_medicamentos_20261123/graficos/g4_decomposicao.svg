<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" role="img" aria-labelledby="tt dd"><title id="tt">Decomposição: preço de comparáveis × composição (lp, IC95)</title><desc id="dd">Exploratório. ΔĒ = A + B1 + B2 por unidade e evento (identidade exata). Pesos do modelo base.</desc><style>
svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
